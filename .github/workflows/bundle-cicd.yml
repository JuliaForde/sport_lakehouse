name: Databricks Bundle CI/CD

# Triggers:
# - Push to feature/**, fix/**, chore/** → validate + deploy to knowit_dev_julia
# - Pull request to main → validate only
# - Push to main (PR merged) → deploy to knowit_dev (shared dev)
# - Manual trigger → deploy to knowit_live

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'knowit_live'
        type: choice
        options:
          - knowit_live

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── PR to main: validate only ─────────────────────────────────────────────────
  validate:
    name: Validate bundle (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle validate --target knowit_dev_julia

  # ── Push to feature/fix/chore: validate + deploy to personal sandbox ──────────
  deploy-personal:
    name: Deploy to knowit_dev_julia
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/'))
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle validate --target knowit_dev_julia
      - name: Deploy to knowit_dev_julia
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle deploy --target knowit_dev_julia

  # ── Push to main: deploy to shared dev ───────────────────────────────────────
  deploy-dev:
    name: Deploy to knowit_dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle validate --target knowit_dev
      - name: Deploy to knowit_dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle deploy --target knowit_dev

  # ── Manual: deploy to knowit_live ────────────────────────────────────────────
  deploy-live:
    name: Deploy to knowit_live
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle validate --target knowit_live
      - name: Deploy to knowit_live
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        working-directory: bundles/sport_lakehouse
        run: databricks bundle deploy --target knowit_live
