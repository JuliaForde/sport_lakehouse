name: Databricks Bundle CI/CD

# Triggers:
# - Push to feature/**, fix/**, chore/** → validate + auto-deploy to personal sandbox (dev_julia, dev_gil, etc.)
# - Pull request to main → validate only (no deploy)
# - Push to main (PR merged) → auto-deploy to shared dev
# - Manual trigger → deploy to dev_live
#
# TODO: Add GitHub Environment approval gates for dev_julia and dev_live deploys
#       once GitHub Enterprise is available. Currently deploys run without approval.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev_live'
        type: choice
        options:
          - dev_live

# Prevent concurrent deploys on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── PR to main: validate only ─────────────────────────────────────────────────
  validate:
    name: Validate bundle (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          # AUTH: currently using Personal Access Token (PAT)
          # TODO: replace with Service Principal when available:
          #   DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          #   DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle validate

  # ── Push to feature/fix/chore branch: validate + deploy to personal sandbox ────
  deploy-personal:
    name: Deploy to personal sandbox
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/'))
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle validate

      # TODO: Add GitHub Environment approval gate here once GitHub Enterprise is available.
      # Each developer should have their own environment (dev_julia, dev_gil) with
      # themselves as required reviewer.
      - name: Deploy to dev_julia
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle deploy --target dev_julia

  # ── Push to main: deploy to shared dev ───────────────────────────────────────
  deploy-dev:
    name: Deploy to shared dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle validate

      - name: Deploy to dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle deploy --target dev

  # ── Manual: deploy to dev_live ────────────────────────────────────────────────
  deploy-dev-live:
    name: Deploy to dev_live
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # TODO: uncomment when GitHub Enterprise is available:
    # environment: dev_live
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle validate

      - name: Deploy to dev_live
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-8c27291b-31c5.cloud.databricks.com
        run: databricks bundle deploy --target dev_live
