name: Databricks Bundle CI/CD

# Triggers:
# - Pull request to main → validate only
# - Push to main (PR merged) → deploy to live

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

# Prevent concurrent deploys on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── PR to main: validate only ─────────────────────────────────────────────────
  validate:
    name: Validate bundle (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: bundles/sport_lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-ef88803f-e606.cloud.databricks.com
        run: databricks bundle validate --target live

  # ── Push to main: deploy to live ──────────────────────────────────────────────
  deploy-live:
    name: Deploy to live
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: bundles/sport_lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-ef88803f-e606.cloud.databricks.com
        run: databricks bundle validate --target live
      - name: Deploy to live
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: https://dbc-ef88803f-e606.cloud.databricks.com
        run: databricks bundle deploy --target live
