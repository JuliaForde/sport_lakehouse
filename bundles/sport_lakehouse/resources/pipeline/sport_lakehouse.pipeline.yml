resources:
  pipelines:
    sport_lakehouse_pipeline:
      name: sport_lakehouse
      catalog: ${var.catalog}
      target: bronze
      serverless: true
      allow_duplicate_names: true
      configuration:
        catalog: ${var.catalog}
        landing.root: /Volumes/sport_lakehouse/landing/sports

      libraries:
        # --- Bronze ---
        - file:
            path: ../../src/bronze/landing_to_bronze.py

        # --- Silver ---
        - file:
            path: ../../src/silver/utils.py
        - file:
            path: ../../src/silver/configs.py
        # Root tables (no FKs)
        - file:
            path: ../../src/silver/addresses.py
        - file:
            path: ../../src/silver/sport_types.py
        # Depend on addresses
        - file:
            path: ../../src/silver/members.py
        - file:
            path: ../../src/silver/clubs.py
        # Depend on clubs + sport_types
        - file:
            path: ../../src/silver/club_sports.py
        # Depend on members + clubs
        - file:
            path: ../../src/silver/affiliations.py
        - file:
            path: ../../src/silver/memberships.py
        # Depend on members + addresses + clubs + sport_types
        - file:
            path: ../../src/silver/competitions.py
        # Depend on memberships + members
        - file:
            path: ../../src/silver/membership_payments.py
        # Depend on competitions + members + clubs
        - file:
            path: ../../src/silver/participation.py
        - file:
            path: ../../src/silver/competition_waitlist.py
        # Depend on participation
        - file:
            path: ../../src/silver/results.py

        # --- Gold ---
        - file:
            path: ../../src/gold/addresses.py
        - file:
            path: ../../src/gold/sport_types.py
        - file:
            path: ../../src/gold/members.py
        - file:
            path: ../../src/gold/clubs.py
        - file:
            path: ../../src/gold/club_sports.py
        - file:
            path: ../../src/gold/affiliations.py
        - file:
            path: ../../src/gold/memberships.py
        - file:
            path: ../../src/gold/competitions.py
        - file:
            path: ../../src/gold/membership_payments.py
        - file:
            path: ../../src/gold/participation.py
        - file:
            path: ../../src/gold/competition_waitlist.py
        - file:
            path: ../../src/gold/results.py
