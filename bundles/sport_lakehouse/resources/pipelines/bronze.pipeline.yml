resources:
  pipelines:
    bronze_pipeline:
      name: sport_landing_to_bronze
      catalog: ${var.catalog}
      target: bronze
      serverless: true
      allow_duplicate_names: true
      configuration:
        landing.root: /Volumes/sport_lakehouse/landing/sports
      libraries:
        - file:
            path: ../../src/bronze/landing_to_bronze.py
