resources:
  pipelines:
    sport_silver_pipeline:
      name: sport_silver_pipeline
      catalog: ${var.catalog}
      target: silver
      serverless: true
      allow_duplicate_names: true
      configuration:
        catalog: ${var.catalog}
      libraries:
        - file:
            path: ../../src/silver/utils.py
        - file:
            path: ../../src/silver/configs.py
        # Root tables (ingen FK)
        - file:
            path: ../../src/silver/addresses.py
        - file:
            path: ../../src/silver/sport_types.py
        # Avheng av addresses
        - file:
            path: ../../src/silver/members.py
        - file:
            path: ../../src/silver/clubs.py
        # Avheng av clubs + sport_types
        - file:
            path: ../../src/silver/club_sports.py
        # Avheng av members + clubs
        - file:
            path: ../../src/silver/affiliations.py
        - file:
            path: ../../src/silver/memberships.py
        # Avheng av members + addresses + clubs + sport_types
        - file:
            path: ../../src/silver/competitions.py
        # Avheng av memberships + members
        - file:
            path: ../../src/silver/membership_payments.py
        # Avheng av competitions + members + clubs
        - file:
            path: ../../src/silver/participation.py
        - file:
            path: ../../src/silver/competition_waitlist.py
        # Avheng av participation
        - file:
            path: ../../src/silver/results.py
        # Aktiveres etter daily notebooks:
        # club_weather_daily, club_weather_monitoring, weather_stations
